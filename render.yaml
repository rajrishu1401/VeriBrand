services:
  - type: web
    name: veribrand-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: DATABASE_URL
        value: sqlite:///./veribrand.db
    disk:
      name: veribrand-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
